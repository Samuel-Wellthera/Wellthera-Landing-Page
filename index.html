<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0c" />
  <title>Wellthera Integrated Health — Coming Soon</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --gold: #c5a059;
      --gold-soft: #b89753;
      --ink: #0a0f0c;
      --paper: #f6f1e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transform: scale(1.02);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      will-change: opacity;
    }

    .bg-video.is-active {
      opacity: 1;
    }

    .stage.is-ready .bg-video.is-active {
      opacity: 1;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(
          ellipse at 50% 40%,
          rgba(15, 20, 18, 0.35) 0%,
          rgba(10, 15, 12, 0.65) 55%,
          rgba(0, 0, 0, 0.85) 100%
        ),
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.55) 0%,
          rgba(15, 20, 18, 0.35) 45%,
          rgba(0, 0, 0, 0.75) 100%
        );
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.77 0 0 0 0 0.63 0 0 0 0 0.35 0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top), 24px) 28px
        max(env(safe-area-inset-bottom), 40px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 0 0 auto;
      opacity: 0;
      transform: translateY(-8px);
      animation: fadeDown 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .brand img {
      width: min(58vw, 300px);
      height: auto;
      max-height: 30vh;
      object-fit: contain;
      filter: drop-shadow(0 8px 40px rgba(197, 160, 89, 0.28));
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 420px;
      gap: 22px;
      flex: 1 1 auto;
      padding: 0 12px;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(18px, 5.2vw, 23px);
      line-height: 1.45;
      letter-spacing: 0.005em;
      color: rgba(246, 241, 230, 0.94);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      max-width: 26ch;
      text-wrap: balance;
      opacity: 0;
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }

    .divider {
      width: 36px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
      opacity: 0;
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.15s forwards;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(30px, 8.4vw, 40px);
      line-height: 1.1;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
      padding-left: 0.28em;
      opacity: 0;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      min-width: 200px;
      margin-top: 6px;
      background: rgba(10, 15, 12, 0.25);
      border: 1px solid rgba(197, 160, 89, 0.85);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        0 0 22px rgba(197, 160, 89, 0.22),
        inset 0 0 0 rgba(197, 160, 89, 0);
      transition:
        background 0.5s ease,
        box-shadow 0.5s ease,
        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.5s ease;
      opacity: 0;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }

    .cta::after {
      content: '';
      width: 14px;
      height: 1px;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.45s ease, background 0.45s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      background: rgba(197, 160, 89, 0.14);
      border-color: var(--gold);
      box-shadow:
        0 0 32px rgba(197, 160, 89, 0.45),
        inset 0 0 12px rgba(197, 160, 89, 0.08);
      transform: translateY(-1px);
      outline: none;
    }

    .cta:hover::after,
    .cta:focus-visible::after {
      width: 22px;
      background: var(--gold);
    }

    .foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      opacity: 0;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.75s forwards;
    }

    .foot-line {
      width: 1px;
      height: 26px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(197, 160, 89, 0.7)
      );
    }

    .foot-text {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(246, 241, 230, 0.55);
    }

    @keyframes fadeDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .brand img {
        width: min(30vw, 320px);
        max-height: 32vh;
      }
      .hero {
        gap: 30px;
        max-width: 500px;
      }
      .tagline {
        font-size: 24px;
      }
      .headline {
        font-size: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001s !important;
        animation-delay: 0s !important;
      }
      .bg-video {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <video
      id="bg-video-1"
      class="bg-video"
      muted
      playsinline
      preload="auto"
      crossorigin="anonymous"
    >
      <source
        src="hf_20260807_031532_68295a3e-341d-411f-a39d-59469f54b5ec.mp4"
        type="video/mp4"
      />
    </video>

    <video
      id="bg-video-2"
      class="bg-video"
      muted
      playsinline
      preload="auto"
      crossorigin="anonymous"
    >
      <source
        src="hf_20260807_034200_2ee6096c-4a71-4160-a21e-56e05c9ad055 (1).mp4"
        type="video/mp4"
      />
    </video>

    <div class="video-overlay"></div>
    <div class="grain"></div>

    <div class="content">
      <header class="brand">
        <img
          src="Green Logo - no background.webp"
          alt="Wellthera Integrated Health"
        />
      </header>

      <section class="hero">
        <p class="tagline">
          Our clients deserve an exceptional, seamless experience.
        </p>
        <span class="divider" aria-hidden="true"></span>
        <h1 class="headline">Coming Soon</h1>
        <a
          class="cta"
          href="https://welltheraintegratedhealth.clinicsense.com/book/"
          target="_blank"
          rel="noopener"
          aria-label="Book an appointment"
        >
          Book an Appointment
        </a>
      </section>

      <footer class="foot">
        <span class="foot-line" aria-hidden="true"></span>
        <span class="foot-text">Wellthera Integrated Health</span>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      const V1 = document.getElementById('bg-video-1');
      const V2 = document.getElementById('bg-video-2');
      const stage = document.getElementById('stage');
      if (!V1 || !V2) return;

      const FWD_RATE = 0.55; // lower = slower / more cinematic
      let unlocked = false;

      const activate = (video) => {
        [V1, V2].forEach((v) => {
          v.classList.toggle('is-active', v === video);
        });
      };

      const safePlay = (video) => {
        const p = video.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => {
            if (unlocked) return;
            const resume = () => {
              unlocked = true;
              video.play().catch(() => {});
              document.removeEventListener('touchstart', resume);
              document.removeEventListener('click', resume);
            };
            document.addEventListener('touchstart', resume, { once: true });
            document.addEventListener('click', resume, { once: true });
          });
        }
      };

      const playForward = (video, onEnd) => {
        activate(video);
        try { video.playbackRate = FWD_RATE; } catch (_) {}
        const handleEnded = () => {
          video.removeEventListener('ended', handleEnded);
          if (onEnd) onEnd();
        };
        video.addEventListener('ended', handleEnded);
        video.currentTime = 0;
        safePlay(video);
      };

      const start = () => {
        // V1 forward -> V2 forward -> hold on last frame
        playForward(V1, () => {
          V1.pause();
          playForward(V2, () => {
            // Hold the last frame of V2
            try { V2.pause(); } catch (_) {}
          });
        });
      };

      // Wait until both videos are ready enough for smooth handoff
      let readyCount = 0;
      const onReady = () => {
        readyCount++;
        if (readyCount >= 2) {
          stage.classList.add('is-ready');
          start();
        }
      };
      [V1, V2].forEach((v) => {
        if (v.readyState >= 2) onReady();
        else v.addEventListener('loadeddata', onReady, { once: true });
      });
    })();
  </script>
</body>
</html>
